;청룡은 발동 방식이 다른 책략과 다르기에 이 신규속성의 효과를 받지 않는다.


; FileHead는 exe내부에 있는 전투 조형 주소를 의미.
; RFileHead는 exe 내부에 있는 평상 조형 주소를 의미.
; UserPath는 현재 조조전이 설치된 주소를 의미.
; UserXK는 exe내부에 있는 병종 상성 주소를 의미.
; CountBZ3는 삼단 병종의 수를 의미. 현재 20개.
; CountBZ1는 단일 병종의 수를 의미. 현재 20개.
; SCount는 Star.e5내의 장비 수를 의미.
; SMagic은 책략의 수를 의미.
; Threes는 삼단 조형의 수를 의미. 현재 32개.
; CountSV는 저장 파일의 숫자를 의미.
; BzXG는 각종 코드 숫자를 의미. 현재 254개.
; 이 설정은 6.6버전에서만 유효함.
