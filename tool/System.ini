;---------------확장된 책략의 수정주소와 수정방법------------------
;---------------------해당 기능은 6.4에서부터 도입---------------------
;책략의 최대 숫자는 공백 포함 144개이며，모든 144개의 책략은 독립된 수치를 가지고 있다.


MgID=666992      ;4D1570 A2D70  책략효과설정
;일반적으로 손댈 일은 없지만 새로운 책략을 추가하겠다면 수정필수.

-----------------------------------------------------------------
MgAIYN1=667136   ;4D1600 A2E00  적군의 전장 책략사용여부 설정. 13（0D）일 경우 사용불가.
MgAIYN2=667280   ;4D1690 A2E90  적군과 자신의 연무장 책략사용여부 설정. 13（0D）일 경우 사용불가.
;특정 책략의 경우 연무장에 부적합하며 버그를 유발할 가능성이 있으므로 제한설정이 필수.
;각종 이동계나 신규책략의 경우 버그를 유발할 가능성이 있으므로 제한설정이 필수.

-----------------------------------------------------------------
MgHit=667424     ;4D1720 A2F20  책략명중상한
;일반적으로 입력된 수치를 따라가나 특수 설정이 존재.
;0 명중상한치90  （대각성）
;1 명중상한치100 （각성）
;2 명중상한치100 （날씨, 보급 등）
;3 명중상한치33  （현혹）
;4 명중상한치50  （해일）
;-----------------------------------------------------------------
            
MgHurt=667712    ;4D1840 A3040  책략피해수치
;일반적으로 입력된 수치를 따라가나 28（1C）는 무피해나 유익한 책략에 적용.
;특정 무피해 책략은 이 수치를 다르게 사용하는데 소환술이 해당.
              
MgHurtYN=667856  ;4D18D0 A30D0  책략피해여부
;0 원소계
;1 중독, 부동
;2 팔진도, 처벌
;3 청룡, 주작
;4 무피해
;위의 두 수치에서 피해여부가 피해수치보다 우선되며 무피해일 경우 피해수치도 무효가 되지만 첩보만은 예외.

;-----------------------------------------------------------------          
MgMeff=668000    ;4D1960 A3160  meff번호.
MgMcall=668144   ;4D19F0 A31F0  mcall번호.
;mcall번호가 100（64h）미만일 경우, 수치가 무효가 되며，meff가 100이상일 경우 Mcall이 먼저 출력되고 뒤이어 Meff가 출력.

;----------------------------------------------------------------- 
